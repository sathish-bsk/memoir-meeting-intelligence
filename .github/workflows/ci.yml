name: CI

on:
  push:
  pull_request:

jobs:
  core-api-tests:
    name: Core API tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core_api/requirements.txt
      - name: Install dependencies
        run: pip install -r core_api/requirements.txt -e videoclip_common pytest pytest-asyncio
      - name: Run tests
        working-directory: core_api
        run: python -m pytest -q

  botworker-tests:
    name: BotWorker tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches BotWorker/Dockerfile
          cache: pip
          cache-dependency-path: BotWorker/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r BotWorker/requirements.txt -e videoclip_common
      - name: Run tests
        working-directory: BotWorker
        run: python -m pytest -q

  typecheck:
    name: Type-check ${{ matrix.project }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, orchestrator, chrome_extension]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci
      - name: tsc --noEmit
        working-directory: ${{ matrix.project }}
        run: npx tsc --noEmit
