[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videoclip-common"
version = "0.1.0"
description = "Shared library for VideoClip/Memoir platform services"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=41.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
include = ["videoclip_common*"]
